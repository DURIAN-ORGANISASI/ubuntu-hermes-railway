      <text x="91" y="72" fill="#9DB9D9" font-family="Inter,Arial,sans-serif" font-size="15">CLI + messaging Gateway</text>
      <rect x="0" y="128" width="340" height="100" rx="16" fill="#102238" stroke="#31516F" stroke-width="2"/>
      <path d="M32 159H68V190H32Z M28 166H72 M39 181H61" fill="none" stroke="#52E7FF" stroke-width="3" stroke-linecap="round"/>
      <text x="91" y="169" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Railway Volume</text>
      <text x="91" y="195" fill="#9DB9D9" font-family="Inter,Arial,sans-serif" font-size="15">/opt/data · persistent state</text>
      <rect x="0" y="250" width="161" height="76" rx="15" fill="#142A45" stroke="#2B5C9B" stroke-width="2"/>
      <rect x="179" y="250" width="161" height="76" rx="15" fill="#142A45" stroke="#2B5C9B" stroke-width="2"/>
      <text x="80" y="281" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700">Telegram</text>
      <text x="80" y="305" fill="#8BBCEB" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">Bot Gateway</text>
      <text x="259" y="281" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700">Discord</text>
      <text x="259" y="305" fill="#8BBCEB" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">Bot Gateway</text>
      <path d="M170 206V238M170 238H80V250M170 238H259V250" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="528" y="466" fill="#7F9DBD" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle" letter-spacing="1.6">UBUNTU 26.04  •  DOCKER  •  RAILWAY</text>
