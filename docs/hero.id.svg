<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ubuntu Hermes Railway</title>
  <desc id="desc">Original illustration of an Ubuntu web terminal, Hermes Agent, persistent storage, and chat connections.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset=".55" stop-color="#0D1830"/><stop offset="1" stop-color="#102B4A"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#246BFF"/><stop offset="1" stop-color="#04DDF1"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#152744"/><stop offset="1" stop-color="#0C172A"/></linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="920" cy="115" r="190" fill="#136BFF" opacity=".18" filter="url(#softGlow)"/>
  <circle cx="1015" cy="475" r="190" fill="#00D7F2" opacity=".12" filter="url(#softGlow)"/>
  <path d="M0 522C230 450 370 630 630 535S1000 455 1200 510V630H0Z" fill="#091321" opacity=".65"/>
  <g transform="translate(72 72)">
