    <path d="M24 0H1032A24 24 0 0 1 1056 24V58H0V24A24 24 0 0 1 24 0Z" fill="#162943"/>
    <circle cx="27" cy="29" r="7" fill="#FF6B6B"/><circle cx="51" cy="29" r="7" fill="#FFD166"/><circle cx="75" cy="29" r="7" fill="#36D6A0"/>
    <text x="528" y="35" fill="#BFD5F0" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="2">RAILWAY WEB TERMINAL</text>
    <g transform="translate(38 94)">
      <rect width="595" height="350" rx="15" fill="url(#card)" stroke="#284A72" stroke-width="2"/>
      <text x="27" y="43" fill="#51E8FF" font-family="ui-monospace,Consolas,monospace" font-size="19">$</text>
      <text x="53" y="43" fill="#F2F7FF" font-family="ui-monospace,Consolas,monospace" font-size="19">hermes status</text>
      <text x="27" y="86" fill="#79E8B5" font-family="ui-monospace,Consolas,monospace" font-size="16">●</text>
      <text x="52" y="86" fill="#CDE2F8" font-family="ui-monospace,Consolas,monospace" font-size="16">Hermes Agent ready</text>
      <text x="27" y="120" fill="#8BB4DF" font-family="ui-monospace,Consolas,monospace" font-size="15">HOME</text>
      <text x="140" y="120" fill="#FFFFFF" font-family="ui-monospace,Consolas,monospace" font-size="15">/opt/data</text>
      <text x="27" y="154" fill="#8BB4DF" font-family="ui-monospace,Consolas,monospace" font-size="15">GATEWAY</text>
      <text x="140" y="154" fill="#79E8B5" font-family="ui-monospace,Consolas,monospace" font-size="15">auto-start enabled</text>
      <path d="M27 180H560" stroke="#284A72" stroke-width="1"/>
      <text x="27" y="218" fill="#51E8FF" font-family="ui-monospace,Consolas,monospace" font-size="18">$ hermes gateway setup</text>
      <rect x="27" y="245" width="10" height="21" rx="2" fill="#51E8FF"/>
      <text x="52" y="262" fill="#CDE2F8" font-family="ui-monospace,Consolas,monospace" font-size="15">Telegram  •  Discord  •  Model API</text>
      <text x="27" y="313" fill="#718EAF" font-family="ui-monospace,Consolas,monospace" font-size="13">Persistent state · Protected terminal</text>
    </g>
    <g transform="translate(670 100)">
      <rect width="340" height="106" rx="16" fill="#132640" stroke="#3169B7" stroke-width="2"/>
      <circle cx="48" cy="52" r="25" fill="url(#accent)"/>
      <path d="M37 43L47 52L37 61M53 61H63" fill="none" stroke="#061322" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
