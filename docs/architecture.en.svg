<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Ubuntu Hermes Railway architecture</title><desc id="desc">Browser to Railway, authenticated terminal, Ubuntu container, persistent storage, Hermes Gateway, model providers, Telegram and Discord.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101D"/><stop offset="1" stop-color="#102543"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2C70FF"/><stop offset="1" stop-color="#08D8EE"/></linearGradient></defs>
<rect width="1200" height="540" rx="22" fill="url(#bg)"/>
<text x="48" y="52" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Service flow</text><text x="48" y="80" fill="#8EACCE" font-family="Inter,Arial,sans-serif" font-size="15">Terminal access, persistent storage, Gateway, and external integrations</text>
<g font-family="Inter,Arial,sans-serif">
<rect x="42" y="136" width="190" height="105" rx="15" fill="#132743" stroke="#3771BB" stroke-width="2"/><text x="137" y="176" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">Browser</text><text x="137" y="204" fill="#9AC7F6" font-size="15" text-anchor="middle">HTTPS</text>
<path d="M232 188H270" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/><path d="M260 178L270 188L260 198" fill="none" stroke="#08D8EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="272" y="136" width="210" height="105" rx="15" fill="#132743" stroke="#3771BB" stroke-width="2"/><text x="377" y="174" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">Railway</text><text x="377" y="202" fill="#9AC7F6" font-size="15" text-anchor="middle">Domain + port</text>
<path d="M482 188H520" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/><path d="M510 178L520 188L510 198" fill="none" stroke="#08D8EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="522" y="136" width="250" height="105" rx="15" fill="#162C49" stroke="#06BBDD" stroke-width="2"/><text x="647" y="173" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">ttyd + Ubuntu</text><text x="647" y="201" fill="#9FEFFA" font-size="15" text-anchor="middle">Authentication required</text>
<path d="M772 188H810" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/><path d="M800 178L810 188L800 198" fill="none" stroke="#08D8EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="812" y="136" width="346" height="105" rx="15" fill="#182743" stroke="#7568FF" stroke-width="2"/><text x="985" y="174" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">Hermes Agent</text><text x="985" y="202" fill="#C5C4FF" font-size="15" text-anchor="middle">CLI + Gateway supervisor</text>
<path d="M985 241V288H774V324" fill="none" stroke="#7568FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M985 288H1000V324" fill="none" stroke="#7568FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="665" y="326" width="220" height="90" rx="14" fill="#102C32" stroke="#16BFA6" stroke-width="2"/><text x="775" y="361" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">Model / Tools</text><text x="775" y="389" fill="#97E6D5" font-size="15" text-anchor="middle">API provider</text>
<rect x="900" y="326" width="220" height="90" rx="14" fill="#102C32" stroke="#16BFA6" stroke-width="2"/><text x="1010" y="361" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">Messaging</text><text x="1010" y="389" fill="#97E6D5" font-size="15" text-anchor="middle">Telegram / Discord</text>
<path d="M647 241V290H240V324" fill="none" stroke="#4585D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="42" y="326" width="360" height="90" rx="14" fill="#162A43" stroke="#4585D8" stroke-width="2"/><text x="222" y="361" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">Railway Volume</text><text x="222" y="389" fill="#9AC7F6" font-size="15" text-anchor="middle">/opt/data · config, sessions, logs</text>
<text x="48" y="477" fill="#89A8CB" font-size="15">Rebuildable runtime tools and caches are kept outside the persistent Volume.</text><text x="48" y="504" fill="#89A8CB" font-size="15">Gateway auto-start requires HERMES_AUTOSTART=true and an existing config.yaml.</text>
