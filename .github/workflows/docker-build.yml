name: Docker build, runtime validation, and security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build and test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    env:
      TERMINAL_USER: railway-ci-test
      TERMINAL_PASSWORD: ci-only-smoke-test-Password-2026
      IMAGE_TAG: ubuntu-hermes-railway-ci:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check shell and Python syntax
        run: |
          set -Eeuo pipefail
          bash -n entrypoint.sh
          bash -n start-hermes
          bash -n system-banner.sh
          python3 -m py_compile service-supervisor.py skills/github-repo-search-star/scripts/search_and_star.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build the Railway Hermes image
        run: docker buildx build --pull --platform "${{ matrix.platform }}" --load --tag "$IMAGE_TAG" .

      - name: Verify Hermes CLI, terminal authentication, non-root user, and persistent paths
        shell: bash
        run: |
          set -Eeuo pipefail
          container_name="ubuntu-hermes-railway-smoke"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1::8080 \
            --env TERMINAL_USER \
            --env TERMINAL_PASSWORD \
            --env PORT=8080 \
            --env HERMES_AUTOSTART=false \
            "$IMAGE_TAG" >/dev/null

          host_port="$(docker port "$container_name" 8080/tcp | sed 's/.*://')"
          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /tmp/ttyd-authorized.html --write-out '%{http_code}' \
              --user "${TERMINAL_USER}:${TERMINAL_PASSWORD}" \
              "http://127.0.0.1:${host_port}/" 2>/dev/null || true)"
            if [[ "$status" == "200" ]]; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "1" ]] || [[ ! -s /tmp/ttyd-authorized.html ]] || ! grep -qi "ttyd" /tmp/ttyd-authorized.html; then
            echo "ERROR: authenticated terminal smoke test failed."
            docker logs "$container_name" 2>&1 || true
            exit 1
          fi

          unauthorized_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:${host_port}/" 2>/dev/null || true)"
          if [[ "$unauthorized_code" != "401" ]]; then
            echo "ERROR: unauthenticated request was not rejected (HTTP $unauthorized_code)."
            exit 1
          fi

          process_uid="$(docker exec "$container_name" awk '/^Uid:/ {print $2}' /proc/1/status)"
          if [[ "$process_uid" != "10001" ]]; then
            echo "ERROR: service supervisor is running with UID $process_uid, expected 10001."
            exit 1
          fi

          docker exec --user 10001:10001 "$container_name" sh -ec '
            hermes --version >/dev/null
            test -w /opt/data
            test -w /usr/local/share/hermes-tools
            touch /opt/data/.ci-write-test /data/.ci-write-test
            rm -f /opt/data/.ci-write-test /data/.ci-write-test
          '

          logs="$(docker logs "$container_name" 2>&1 || true)"
          credential_b64="$(printf '%s' "${TERMINAL_USER}:${TERMINAL_PASSWORD}" | base64 -w0)"
          if grep -Fq "$TERMINAL_PASSWORD" <<<"$logs" || grep -Fq "$credential_b64" <<<"$logs"; then
            echo "ERROR: terminal logs appear to contain a credential or its Base64 encoding."
            exit 1
          fi

          echo "PASS: ${{ matrix.platform }} image; Hermes CLI works, authentication is enforced, services run as UID 10001, persistent paths are writable, and logs omit credentials."

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
